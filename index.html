<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Astro-sky</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #010207;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

body {
    min-height: 100vh;
}


/* =========================
   HEADER
========================= */

header {

    padding: 15px 18px;

    background: #070a14;

    border-bottom:
        1px solid #1b2338;
}

h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
}

.subtitle {

    margin-top: 4px;

    color: #8d98b0;

    font-size: 12px;
}


/* =========================
   SKY
========================= */

#sky {

    position: relative;

    height: 58vh;

    min-height: 400px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            #18264d 0%,
            #080e24 43%,
            #010207 100%
        );
}


/* =========================
   HORIZON
========================= */

.horizon {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 12%;

    border-top:
        1px solid
        rgba(255,255,255,0.25);
}


/* =========================
   DIRECTIONS
========================= */

.direction {

    position: absolute;

    z-index: 20;

    color:
        rgba(255,255,255,0.7);

    font-size: 12px;
}

.north {

    top: 5%;
    left: 50%;

    transform:
        translateX(-50%);
}

.south {

    bottom: 5%;
    left: 50%;

    transform:
        translateX(-50%);
}

.east {

    top: 50%;
    right: 3%;
}

.west {

    top: 50%;
    left: 3%;
}


/* =========================
   STAR
========================= */

.star {

    position: absolute;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white;

    z-index: 5;

    transition:
        left 0.3s linear,
        top 0.3s linear;
}


/* =========================
   STAR NAME
========================= */

.star-name {

    position: absolute;

    margin-left: 7px;

    margin-top: -5px;

    white-space: nowrap;

    color:
        rgba(255,255,255,0.65);

    font-size: 9px;

    pointer-events: none;
}


/* =========================
   DSO
========================= */

.dso {

    position: absolute;

    width: 18px;
    height: 18px;

    border:
        2px solid #62aaff;

    border-radius: 50%;

    box-shadow:
        0 0 15px
        rgba(80,160,255,0.9);

    transform:
        translate(-50%, -50%);

    z-index: 15;
}

.dso::before {

    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #9bcaff;

    box-shadow:
        0 0 10px #9bcaff;
}

.dso-label {

    position: absolute;

    left: 21px;
    top: -6px;

    white-space: nowrap;

    color: #8ec5ff;

    font-size: 10px;
}


/* =========================
   TARGET CENTER
========================= */

.target {

    position: absolute;

    left: 50%;
    top: 45%;

    width: 90px;
    height: 90px;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(100,180,255,0.6);

    border-radius: 50%;

    z-index: 25;

    pointer-events: none;
}

.target::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 6px;
    height: 6px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #9bcaff;

    box-shadow:
        0 0 12px #9bcaff;
}


/* =========================
   INFO
========================= */

.info {

    padding: 15px;

    background: #070a14;

    border-top:
        1px solid #1b2338;
}

.title {

    margin-bottom: 10px;

    font-size: 17px;

    font-weight: 600;
}


select {

    width: 100%;

    padding: 13px;

    border: 0;

    border-radius: 9px;

    background: #151c2f;

    color: white;

    font-size: 15px;
}


.grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 10px;
}


.card {

    padding: 10px;

    background: #101522;

    border-radius: 9px;
}

.label {

    color: #8490a8;

    font-size: 10px;
}

.value {

    margin-top: 4px;

    font-size: 15px;
}


button {

    width: 100%;

    margin-top: 10px;

    padding: 14px;

    border: 0;

    border-radius: 9px;

    background: #315cff;

    color: white;

    font-size: 15px;
}


.status {

    margin-top: 10px;

    padding: 10px;

    border-radius: 8px;

    background: #101522;

    text-align: center;

    color: #9ba6bd;

    font-size: 11px;
}

.good {
    color: #70d999;
}

.bad {
    color: #ff8d8d;
}

</style>

</head>


<body>


<header>

<h1>🌌 Astro-sky</h1>

<div class="subtitle">
Astrophotography Sky Guide
</div>

</header>


<div id="sky">

<div class="horizon"></div>

<div class="direction north">N</div>

<div class="direction east">E</div>

<div class="direction south">S</div>

<div class="direction west">W</div>

<div class="target"></div>

</div>


<div class="info">

<div class="title">
🔭 撮影対象
</div>


<select id="targetSelect">

<option value="M31">
M31 アンドロメダ銀河
</option>

<option value="M42">
M42 オリオン大星雲
</option>

<option value="M45">
M45 プレアデス星団
</option>

<option value="M8">
M8 干潟星雲
</option>

<option value="M20">
M20 三裂星雲
</option>

<option value="M16">
M16 わし星雲
</option>

<option value="M17">
M17 オメガ星雲
</option>

<option value="M27">
M27 あれい星雲
</option>

<option value="M57">
M57 リング星雲
</option>

<option value="NGC7000">
NGC7000 北アメリカ星雲
</option>

<option value="Veil">
網状星雲
</option>

</select>


<div class="grid">

<div class="card">

<div class="label">
現在時刻
</div>

<div
class="value"
id="time">
--
</div>

</div>


<div class="card">

<div class="label">
スマホ方位
</div>

<div
class="value"
id="heading">
--
</div>

</div>


<div class="card">

<div class="label">
天体高度
</div>

<div
class="value"
id="altitude">
--
</div>

</div>


<div class="card">

<div class="label">
天体方位
</div>

<div
class="value"
id="azimuth">
--
</div>

</div>


<div class="card">

<div class="label">
緯度
</div>

<div
class="value"
id="latitude">
--
</div>

</div>


<div class="card">

<div class="label">
経度
</div>

<div
class="value"
id="longitude">
--
</div>

</div>

</div>


<button onclick="startAstroSky()">

📍 現在地・方位を取得

</button>


<div
class="status"
id="status">

準備完了

</div>

</div>


<script>


/* =================================================
   DEEP SKY OBJECT DATABASE
================================================= */

const objects = {

M31: {
    name: "M31 アンドロメダ銀河",
    ra: 0.712,
    dec: 41.27
},

M42: {
    name: "M42 オリオン大星雲",
    ra: 5.588,
    dec: -5.45
},

M45: {
    name: "M45 プレアデス星団",
    ra: 3.783,
    dec: 24.12
},

M8: {
    name: "M8 干潟星雲",
    ra: 18.063,
    dec: -24.38
},

M20: {
    name: "M20 三裂星雲",
    ra: 18.043,
    dec: -23.03
},

M16: {
    name: "M16 わし星雲",
    ra: 18.313,
    dec: -13.78
},

M17: {
    name: "M17 オメガ星雲",
    ra: 18.346,
    dec: -16.17
},

M27: {
    name: "M27 あれい星雲",
    ra: 19.993,
    dec: 22.72
},

M57: {
    name: "M57 リング星雲",
    ra: 18.893,
    dec: 33.03
},

NGC7000: {
    name: "NGC7000 北アメリカ星雲",
    ra: 20.983,
    dec: 44.52
},

Veil: {
    name: "網状星雲",
    ra: 20.75,
    dec: 30.7
}

};


/* =================================================
   BRIGHT STARS
================================================= */

const starsData = [

["Sirius",6.752,-16.72],
["Canopus",6.399,-52.70],
["Arcturus",14.261,19.18],
["Vega",18.615,38.78],
["Capella",5.278,45.99],
["Rigel",5.242,-8.20],
["Procyon",7.655,5.23],
["Betelgeuse",5.919,7.41],
["Achernar",1.628,-57.24],
["Altair",19.846,8.87],
["Aldebaran",4.599,16.51],
["Antares",16.490,-26.43],
["Spica",13.420,-11.16],
["Pollux",7.756,28.03],
["Fomalhaut",22.961,-29.62],
["Deneb",20.690,45.28],
["Regulus",10.140,11.97],
["Castor",7.577,31.89],
["Polaris",2.530,89.26]

];


/* =================================================
   STATE
================================================= */

let latitude = null;

let longitude = null;

let heading = 0;

let selectedTarget = "M31";


/* =================================================
   ELEMENTS
================================================= */

const sky =
document.getElementById("sky");

const select =
document.getElementById("targetSelect");

const timeElement =
document.getElementById("time");

const headingElement =
document.getElementById("heading");

const altitudeElement =
document.getElementById("altitude");

const azimuthElement =
document.getElementById("azimuth");

const latitudeElement =
document.getElementById("latitude");

const longitudeElement =
document.getElementById("longitude");

const statusElement =
document.getElementById("status");


/* =================================================
   CREATE STARS
================================================= */

const starElements = [];


starsData.forEach(function(data) {

    const star =
    document.createElement("div");

    star.className =
    "star";

    const size =
    2 + Math.random() * 3;

    star.style.width =
    size + "px";

    star.style.height =
    size + "px";


    const name =
    document.createElement("div");

    name.className =
    "star-name";

    name.textContent =
    data[0];

    star.appendChild(name);

    sky.appendChild(star);


    starElements.push({

        element: star,

        data: data

    });

});


/* =================================================
   DSO
================================================= */

const dso =
document.createElement("div");

dso.className =
"dso";


const dsoLabel =
document.createElement("div");

dsoLabel.className =
"dso-label";


dso.appendChild(dsoLabel);

sky.appendChild(dso);


/* =================================================
   JULIAN DATE
================================================= */

function julianDate(date) {

    return date.getTime()
    / 86400000
    + 2440587.5;

}


/* =================================================
   GMST
================================================= */

function getGMST(date) {

    const jd =
    julianDate(date);

    const T =
    (jd - 2451545.0)
    / 36525.0;

    let gmst =
    280.46061837
    +
    360.98564736629
    *
    (jd - 2451545.0)
    +
    0.000387933*T*T
    -
    T*T*T/38710000;

    return (
        (gmst % 360) + 360
    ) % 360;

}


/* =================================================
   EQUATORIAL → HORIZONTAL
================================================= */

function calculateAltAz(
ra,
dec,
lat,
lon,
date
) {

    const lst =
    (
        getGMST(date)
        + lon
    ) / 15;


    const H =
    (lst - ra) * 15;


    const latRad =
    lat * Math.PI / 180;

    const decRad =
    dec * Math.PI / 180;

    const hRad =
    H * Math.PI / 180;


    const sinAlt =
    Math.sin(latRad)
    *
    Math.sin(decRad)
    +
    Math.cos(latRad)
    *
    Math.cos(decRad)
    *
    Math.cos(hRad);


    const altitude =
    Math.asin(
        sinAlt
    )
    *
    180 / Math.PI;


    let azimuth =
    Math.atan2(

        Math.sin(hRad),

        Math.cos(hRad)
        *
        Math.sin(latRad)
        -
        Math.tan(decRad)
        *
        Math.cos(latRad)

    )
    *
    180 / Math.PI;


    azimuth =
    (azimuth + 180) % 360;


    return {

        altitude:
        altitude,

        azimuth:
        azimuth

    };

}


/* =================================================
   DRAW STAR
================================================= */

function drawStar(
star,
date
) {

    const result =
    calculateAltAz(

        star.data[1],
        star.data[2],

        latitude,
        longitude,

        date

    );


    const altitude =
    result.altitude;

    const azimuth =
    result.azimuth;


    if (altitude <= 0) {

        star.element.style.display =
        "none";

        return;

    }


    star.element.style.display =
    "block";


    /*
       方位を横方向に変換

       北=0
       東=90
       南=180
       西=270
    */

    let relative =
    (
        azimuth
        -
        heading
        +
        540
    ) % 360 - 180;


    let x =
    50
    +
    relative / 180 * 45;


    let y =
    88
    -
    altitude * 0.78;


    /*
       画面外
    */

    if (
        x < -5 ||
        x > 105 ||
        y < -5 ||
        y > 105
    ) {

        star.element.style.display =
        "none";

        return;

    }


    star.element.style.left =
    x + "%";

    star.element.style.top =
    y + "%";

}


/* =================================================
   DRAW DSO
================================================= */

function drawDSO(date) {

    const object =
    objects[selectedTarget];


    const result =
    calculateAltAz(

        object.ra,
        object.dec,

        latitude,
        longitude,

        date

    );


    const altitude =
    result.altitude;

    const azimuth =
    result.azimuth;


    altitudeElement.textContent =
    altitude.toFixed(1)
    + "°";


    azimuthElement.textContent =
    azimuth.toFixed(1)
    + "°";


    dsoLabel.textContent =
    selectedTarget;


    if (altitude <= 0) {

        dso.style.display =
        "none";

        statusElement.textContent =
        object.name
        +
        " は現在地平線下です";

        statusElement.className =
        "status bad";

        return;

    }


    let relative =
    (
        azimuth
        -
        heading
        +
        540
    ) % 360 - 180;


    let x =
    50
    +
    relative / 180 * 45;


    let y =
    88
    -
    altitude * 0.78;


    if (
        x < -5 ||
        x > 105 ||
        y < -5 ||
        y > 105
    ) {

        dso.style.display =
        "none";

    }

    else {

        dso.style.display =
        "block";

        dso.style.left =
        x + "%";

        dso.style.top =
        y + "%";

    }


    if (altitude >= 30) {

        statusElement.textContent =
        object.name
        +
        "　撮影しやすい高度";

        statusElement.className =
        "status good";

    }

    else if (altitude >= 10) {

        statusElement.textContent =
        object.name
        +
        "　低空・撮影可能";

        statusElement.className =
        "status";

    }

    else {

        statusElement.textContent =
        object.name
        +
        "　地平線付近";

        statusElement.className =
        "status bad";

    }

}


/* =================================================
   UPDATE SKY
================================================= */

function updateSky() {

    const now =
    new Date();


    timeElement.textContent =
    now.toLocaleTimeString(
        "ja-JP"
    );


    if (
        latitude === null ||
        longitude === null
    ) {

        return;

    }


    starElements.forEach(

        function(star) {

            drawStar(
                star,
                now
            );

        }

    );


    drawDSO(now);

}


/* =================================================
   LOCATION
================================================= */

function getLocation() {

    if (
        !navigator.geolocation
    ) {

        statusElement.textContent =
        "位置情報を利用できません";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            latitude =
            position.coords.latitude;

            longitude =
            position.coords.longitude;


            latitudeElement.textContent =
            latitude.toFixed(5)
            + "°";


            longitudeElement.textContent =
            longitude.toFixed(5)
            + "°";


            updateSky();

        },


        function() {

            statusElement.textContent =
            "位置情報を取得できませんでした";

            statusElement.className =
            "status bad";

        },

        {

            enableHighAccuracy:
            true,

            timeout:
            10000,

            maximumAge:
            0

        }

    );

}


/* =================================================
   ORIENTATION
================================================= */

function handleOrientation(event) {

    let value = null;


    if (
        event.webkitCompassHeading
        !== undefined
        &&
        event.webkitCompassHeading
        !== null
    ) {

        value =
        event.webkitCompassHeading;

    }

    else if (
        event.alpha !== null
    ) {

        value =
        360 - event.alpha;

    }


    if (value === null) {
        return;
    }


    heading =
    (value + 360) % 360;


    headingElement.textContent =
    heading.toFixed(0)
    + "°";


    updateSky();

}


/* =================================================
   START
================================================= */

async function startAstroSky() {

    statusElement.textContent =
    "センサーを起動しています…";


    getLocation();


    if (
        typeof DeviceOrientationEvent
        !== "undefined"
        &&
        typeof DeviceOrientationEvent
        .requestPermission
        === "function"
    ) {

        try {

            const permission =
            await
            DeviceOrientationEvent
            .requestPermission();


            if (
                permission ===
                "granted"
            ) {

                window.addEventListener(
                    "deviceorientation",
                    handleOrientation,
                    true
                );

            }

        }

        catch {

            statusElement.textContent =
            "方位センサーを利用できません";

        }

    }

    else {

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

    }

}


/* =================================================
   TARGET CHANGE
================================================= */

select.addEventListener(
"change",
function() {

    selectedTarget =
    select.value;

    updateSky();

});


/* =================================================
   LOOP
================================================= */

setInterval(
updateSky,
1000
);

updateSky();

</script>

</body>
</html>
